name: Build and Release KnightTrader Coinbase for macOS

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build macOS app
        run: npm run package -- --mac

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnightTrader_Coinbase
          path: dist/KnightTrader_Coinbase*.dmg

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" dist/KnightTrader_Coinbase*.dmg --repo "${{ github.repository }}"
