name: Build and Release KnightTrader Coinbase for macOS

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build macOS app
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npm run package -- --mac --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnightTrader_Coinbase
          path: dist/*.dmg

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/*.dmg --repo "${{ github.repository }}"